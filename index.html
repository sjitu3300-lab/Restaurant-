<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Foodzilla Fast Food | Nagaur's Best Sizzling Fast Food</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #e63946;
      --primary-hover: #ff4757;
      --primary-glow: rgba(230, 57, 70, 0.35);
      --gold: #f5a623;
      --gold-hover: #ffc048;
      --dark-bg: #09090b;
      --card-bg: #141418;
      --card-hover: #1b1b22;
      --border-color: #24242c;
      --text: #f8f9fa;
      --text-muted: #9e9ea7;
      --veg-color: #2ed573;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Poppins', sans-serif;
      background-color: var(--dark-bg);
      color: var(--text);
      line-height: 1.6;
      overflow-x: hidden;
    }

    /* HEADER */
    header {
      position: sticky;
      top: 0;
      background: rgba(9, 9, 11, 0.95);
      backdrop-filter: blur(12px);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.9rem 5%;
      border-bottom: 1px solid var(--border-color);
      z-index: 100;
    }

    .menu-bar-btn {
      background: #18181f;
      color: var(--gold);
      border: 1px solid var(--border-color);
      padding: 0.55rem 1rem;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.3s ease;
    }
    .menu-bar-btn:hover { background: var(--primary); color: #fff; }

    .header-center-logo { text-align: center; text-decoration: none; }
    .header-center-logo .logo-icon { font-size: 1.3rem; display: block; margin-bottom: -5px; }
    .header-center-logo .logo-text {
      font-family: 'Playfair Display', serif;
      font-size: 1.6rem;
      font-weight: 800;
      background: linear-gradient(135deg, #fff 20%, var(--gold) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 1px;
    }

    .header-right-actions { display: flex; align-items: center; gap: 0.75rem; }

    .profile-nav-btn {
      background: #18181f;
      color: var(--text);
      border: 1px solid var(--border-color);
      padding: 0.55rem 1rem;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: 0.3s;
    }
    .profile-nav-btn:hover { border-color: var(--gold); color: var(--gold); }

    .cart-nav-btn {
      background: linear-gradient(135deg, var(--primary) 0%, #d63031 100%);
      color: #fff;
      border: none;
      padding: 0.55rem 1.1rem;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 15px var(--primary-glow);
      transition: all 0.3s ease;
      position: relative;
    }
    .cart-nav-btn:hover { transform: translateY(-2px); }
    .cart-count-badge {
      background: var(--gold);
      color: #000;
      font-size: 0.75rem;
      font-weight: 800;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* SIDEBAR DRAWER */
    .sidebar-drawer {
      position: fixed;
      top: 0;
      left: -320px;
      width: 300px;
      height: 100%;
      background: #111116;
      border-right: 1px solid var(--border-color);
      z-index: 1000;
      transition: left 0.35s ease;
      padding: 2rem 1.5rem;
      display: flex;
      flex-direction: column;
      box-shadow: 10px 0 35px rgba(0,0,0,0.85);
    }
    .sidebar-drawer.active { left: 0; }
    .sidebar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 1.2rem;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 1.5rem;
    }
    .sidebar-title { font-family: 'Playfair Display', serif; color: var(--gold); font-size: 1.3rem; font-weight: 700; }
    .sidebar-close { background: none; border: none; color: var(--text-muted); font-size: 1.6rem; cursor: pointer; }
    .sidebar-links a {
      display: block;
      color: var(--text);
      text-decoration: none;
      padding: 0.85rem 0;
      font-size: 0.95rem;
      font-weight: 500;
      border-bottom: 1px solid #1a1a22;
      transition: 0.3s;
    }
    .sidebar-links a:hover { color: var(--gold); padding-left: 8px; }
    .drawer-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.75);
      backdrop-filter: blur(5px);
      z-index: 999;
      display: none;
    }
    .drawer-overlay.active { display: block; }

    /* HERO SECTION */
    .hero-video-section {
      position: relative;
      height: 85vh;
      min-height: 540px;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      overflow: hidden;
      background: linear-gradient(180deg, rgba(9, 9, 11, 0.65) 0%, rgba(9, 9, 11, 0.92) 100%), 
                  url('https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?auto=format&fit=crop&w=1600&q=80') center/cover no-repeat;
    }

    .hero-content { position: relative; z-index: 3; padding: 0 1.5rem; max-width: 860px; }
    .hero-badge {
      display: inline-block;
      background: rgba(230, 57, 70, 0.25);
      color: var(--gold);
      border: 1px solid rgba(245, 166, 35, 0.5);
      padding: 0.35rem 1.2rem;
      border-radius: 30px;
      font-size: 0.8rem;
      font-weight: 600;
      margin-bottom: 1.2rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .hero-content h1 {
      font-family: 'Playfair Display', serif;
      font-size: 3.4rem;
      margin-bottom: 1rem;
      line-height: 1.2;
      color: #ffffff;
      text-shadow: 0 4px 25px rgba(0,0,0,0.9);
    }
    .hero-content p {
      font-size: 1.15rem;
      color: #e2e2e8;
      margin-bottom: 2rem;
      text-shadow: 0 2px 12px rgba(0,0,0,0.8);
    }
    .hero-btns { display: flex; justify-content: center; gap: 1rem; flex-wrap: wrap; }
    .btn {
      background: linear-gradient(135deg, var(--primary) 0%, #d63031 100%);
      color: #fff; padding: 0.75rem 1.6rem; border-radius: 8px;
      text-decoration: none; font-weight: 600; font-size: 0.95rem;
      transition: all 0.3s; border: none; cursor: pointer;
      box-shadow: 0 4px 15px var(--primary-glow);
    }
    .btn:hover { transform: translateY(-3px); }
    .btn-outline {
      background: rgba(20, 20, 26, 0.8);
      color: var(--gold); border: 1px solid var(--gold); box-shadow: none;
    }
    .btn-outline:hover { background: var(--gold); color: #000; }

    /* MENU SECTION */
    .menu-section { padding: 5rem 5%; max-width: 1320px; margin: 0 auto; }
    .section-header { text-align: center; margin-bottom: 2.8rem; }
    .section-header h2 { font-family: 'Playfair Display', serif; font-size: 2.7rem; color: #ffffff; margin-bottom: 0.4rem; }
    .section-header h2 span { color: var(--primary); }
    .section-header p { color: var(--text-muted); font-size: 1rem; }

    .category-tabs { display: flex; justify-content: center; flex-wrap: wrap; gap: 0.8rem; margin-bottom: 3.5rem; }
    .tab-btn {
      background: #15151c; color: #d1d1db; border: 1px solid var(--border-color);
      padding: 0.65rem 1.4rem; border-radius: 30px; font-size: 0.9rem;
      font-weight: 500; cursor: pointer; transition: all 0.3s ease;
    }
    .tab-btn:hover, .tab-btn.active {
      background: linear-gradient(135deg, var(--primary) 0%, #c0392b 100%);
      color: #fff; border-color: var(--primary); transform: translateY(-2px);
      box-shadow: 0 4px 18px var(--primary-glow);
    }

    .menu-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 2.2rem; }
    .menu-card {
      background: var(--card-bg); border: 1px solid var(--border-color);
      border-radius: 14px; overflow: hidden; transition: all 0.4s ease;
      display: flex; flex-direction: column;
    }
    .menu-card:hover {
      transform: translateY(-8px); background: var(--card-hover);
      border-color: var(--primary); box-shadow: 0 15px 30px rgba(230, 57, 70, 0.25);
    }

    .card-img-wrap { position: relative; height: 210px; overflow: hidden; background: #0d0d10; cursor: pointer; }
    .card-img-wrap img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.6s ease; }
    .menu-card:hover .card-img-wrap img { transform: scale(1.1); }

    .calorie-pill {
      position: absolute; top: 12px; right: 12px;
      background: rgba(9, 9, 11, 0.85); backdrop-filter: blur(6px);
      color: var(--gold); padding: 4px 11px; border-radius: 20px;
      font-size: 0.75rem; font-weight: 600; border: 1px solid rgba(245, 166, 35, 0.3); z-index: 2;
    }

    .card-content { padding: 1.3rem; display: flex; flex-direction: column; flex-grow: 1; }
    .card-title-row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 0.4rem; }
    .card-title { font-size: 1.15rem; font-weight: 600; color: #fff; cursor: pointer; }
    .card-price { color: var(--gold); font-weight: 700; font-size: 1.2rem; }
    
    .veg-indicator { display: flex; align-items: center; gap: 6px; font-size: 0.75rem; color: var(--veg-color); margin-bottom: 0.6rem; font-weight: 600; }
    .veg-dot { width: 8px; height: 8px; background-color: var(--veg-color); border-radius: 50%; }
    .card-desc { color: var(--text-muted); font-size: 0.85rem; line-height: 1.45; margin-bottom: 1.2rem; flex-grow: 1; }
    
    .card-action-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem; margin-top: auto; }
    .btn-add-cart {
      background: #1e1e26; color: var(--gold); border: 1px solid var(--gold);
      padding: 0.5rem; border-radius: 6px; font-size: 0.8rem; font-weight: 600; cursor: pointer; transition: 0.2s;
    }
    .btn-add-cart:hover { background: var(--gold); color: #000; }

    .btn-quick-wa {
      background: #25d366; color: #fff; border: none; padding: 0.5rem;
      border-radius: 6px; font-size: 0.8rem; font-weight: 600; cursor: pointer;
      text-decoration: none; text-align: center; transition: 0.2s;
    }
    .btn-quick-wa:hover { background: #1eb956; }

    /* OWNER SECTION */
    .owner-section { padding: 4rem 5%; max-width: 1320px; margin: 0 auto; }
    .owner-profile-card {
      display: grid; grid-template-columns: 240px 1fr; gap: 2.5rem; align-items: center;
      background: linear-gradient(145deg, #16161f 0%, #111116 100%);
      border: 1px solid rgba(245, 166, 35, 0.3);
      box-shadow: 0 15px 40px rgba(0,0,0,0.85), 0 0 25px rgba(230,57,70,0.15);
      border-radius: 16px; padding: 2.5rem;
    }
    .owner-avatar-wrap { text-align: center; }
    .owner-avatar {
      width: 180px; height: 180px; border-radius: 50%; object-fit: cover;
      border: 4px solid var(--gold); box-shadow: 0 8px 25px rgba(245, 166, 35, 0.3);
      margin: 0 auto 0.8rem; display: block;
    }
    .owner-badge {
      display: inline-block; background: rgba(230, 57, 70, 0.2); color: var(--gold);
      border: 1px solid rgba(245, 166, 35, 0.4); padding: 0.25rem 0.9rem;
      border-radius: 20px; font-size: 0.75rem; font-weight: 600;
    }
    .owner-info h3 { font-family: 'Playfair Display', serif; font-size: 1.8rem; color: #fff; margin-bottom: 0.2rem; }
    .owner-designation { color: var(--gold); font-size: 0.9rem; font-weight: 600; margin-bottom: 0.8rem; display: block; }
    .owner-quote {
      font-style: italic; color: #e2e2ea; border-left: 3px solid var(--primary);
      padding-left: 1rem; margin: 0.8rem 0; font-size: 0.95rem;
    }

    /* CART DRAWER */
    .cart-drawer {
      position: fixed; top: 0; right: -420px; width: 400px; max-width: 90vw; height: 100%;
      background: #131318; border-left: 1px solid var(--border-color); z-index: 1001;
      transition: right 0.35s ease; display: flex; flex-direction: column;
      box-shadow: -10px 0 35px rgba(0,0,0,0.85);
    }
    .cart-drawer.active { right: 0; }
    .cart-header { padding: 1.4rem; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
    .cart-header h3 { font-family: 'Playfair Display', serif; color: var(--gold); font-size: 1.3rem; }
    .cart-close-btn { background: none; border: none; color: var(--text-muted); font-size: 1.5rem; cursor: pointer; }
    .cart-items-body { flex-grow: 1; overflow-y: auto; padding: 1.2rem; }
    .cart-empty-msg { text-align: center; color: var(--text-muted); padding: 3rem 1rem; font-size: 0.95rem; }

    .cart-item-row {
      display: flex; align-items: center; gap: 12px; background: #1a1a22;
      padding: 0.8rem; border-radius: 8px; margin-bottom: 0.8rem; border: 1px solid #282834;
    }
    .cart-item-img { width: 55px; height: 55px; border-radius: 6px; object-fit: cover; }
    .cart-item-info { flex-grow: 1; }
    .cart-item-name { font-size: 0.9rem; font-weight: 600; color: #fff; }
    .cart-item-price { font-size: 0.85rem; color: var(--gold); font-weight: 700; }
    
    .qty-controls { display: flex; align-items: center; gap: 6px; margin-top: 4px; }
    .qty-btn { background: #252532; border: none; color: #fff; width: 24px; height: 24px; border-radius: 4px; cursor: pointer; font-weight: 700; }
    .qty-btn:hover { background: var(--primary); }
    .qty-text { font-size: 0.85rem; font-weight: 600; width: 20px; text-align: center; }
    .item-del-btn { background: none; border: none; color: #ff5252; cursor: pointer; font-size: 1.1rem; padding: 4px; }

    .cart-footer { padding: 1.2rem; border-top: 1px solid var(--border-color); background: #0f0f13; }
    .calc-row { display: flex; justify-content: space-between; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.3rem; }
    .calc-row.total-row { font-size: 1.1rem; color: #fff; font-weight: 700; border-top: 1px dashed var(--border-color); padding-top: 0.6rem; margin-top: 0.6rem; }
    .calc-row.total-row span:last-child { color: var(--gold); }

    .payment-select-box { margin: 1rem 0; background: #181820; padding: 0.8rem; border-radius: 8px; }
    .payment-select-box label { display: block; font-size: 0.8rem; color: var(--gold); font-weight: 600; margin-bottom: 0.4rem; }
    .pay-options { display: flex; gap: 10px; }
    .pay-option-label {
      flex: 1; background: #121217; border: 1px solid var(--border-color);
      padding: 0.5rem; border-radius: 6px; font-size: 0.75rem; cursor: pointer;
      display: flex; align-items: center; gap: 6px;
    }
    .pay-option-label input { accent-color: var(--primary); }
    .checkout-btn {
      width: 100%; background: linear-gradient(135deg, var(--primary) 0%, #d63031 100%);
      color: #fff; border: none; padding: 0.85rem; border-radius: 8px;
      font-weight: 700; font-size: 0.95rem; cursor: pointer;
    }

    /* AUTH MODAL */
    .auth-modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(8px);
      display: none; justify-content: center; align-items: center; z-index: 1002; padding: 1rem;
    }
    .auth-modal-overlay.active { display: flex; }
    .auth-card { background: #141419; border: 1px solid #2d2d38; border-radius: 16px; max-width: 480px; width: 100%; padding: 2rem; position: relative; }
    .auth-tabs { display: flex; border-bottom: 1px solid var(--border-color); margin-bottom: 1.5rem; }
    .auth-tab-btn { flex: 1; background: none; border: none; color: var(--text-muted); padding: 0.8rem; font-weight: 600; cursor: pointer; font-size: 0.95rem; }
    .auth-tab-btn.active { color: var(--gold); border-bottom: 2px solid var(--gold); }
    .form-group { margin-bottom: 1rem; }
    .form-group label { display: block; font-size: 0.8rem; color: #d1d1db; margin-bottom: 0.3rem; }
    .form-group input, .form-group textarea {
      width: 100%; padding: 0.75rem; background: #0d0d12; border: 1px solid #282834; border-radius: 6px; color: #fff; outline: none; font-family: inherit;
    }
    .form-group input:focus, .form-group textarea:focus { border-color: var(--primary); }
    .auth-submit-btn {
      width: 100%; background: linear-gradient(135deg, var(--primary) 0%, #c0392b 100%); color: #fff; padding: 0.85rem; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; margin-top: 0.5rem;
    }

    /* 3D FOOD DETAIL MODAL */
    .detail-modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.88); backdrop-filter: blur(10px);
      display: none; justify-content: center; align-items: center; z-index: 1000; padding: 1rem;
    }
    .detail-modal-overlay.active { display: flex; }
    .detail-modal-card {
      background: #141419; border: 1px solid #2d2d38; border-radius: 18px;
      max-width: 660px; width: 100%; max-height: 90vh; overflow-y: auto; position: relative; padding: 2.2rem 2rem;
    }
    .close-btn {
      position: absolute; top: 16px; right: 16px; background: #20202a; color: #fff;
      border: none; width: 36px; height: 36px; border-radius: 50%; font-size: 1.2rem;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
    }
    .close-btn:hover { background: var(--primary); }

    .dish-stage { text-align: center; padding: 0.5rem 0; }
    .dish-halo { position: relative; width: 200px; height: 200px; margin: 0 auto; }
    .dish-img {
      width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 4px solid var(--gold); box-shadow: 0 15px 35px rgba(0,0,0,0.8), 0 0 30px rgba(230, 57, 70, 0.45);
      animation: dishFloat 4s ease-in-out infinite alternate;
    }
    @keyframes dishFloat { 0% { transform: translateY(0px); } 100% { transform: translateY(-10px); } }

    .modal-header-row { display: flex; justify-content: space-between; align-items: center; margin-top: 1rem; margin-bottom: 0.4rem; }
    .modal-title { font-family: 'Playfair Display', serif; font-size: 1.7rem; color: #fff; }
    .modal-price { color: var(--gold); font-size: 1.5rem; font-weight: 700; }

    .nutrition-box { background: #1b1b24; border-radius: 12px; padding: 1rem; margin: 1rem 0; border: 1px solid #292936; }
    .nutrition-title { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; color: var(--gold); margin-bottom: 0.6rem; font-weight: 600; }
    .nutrition-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.6rem; text-align: center; }
    .nutri-item { background: #121217; padding: 0.5rem 0.3rem; border-radius: 8px; }
    .nutri-val { font-size: 1.05rem; font-weight: 700; color: #fff; display: block; }
    .nutri-label { font-size: 0.7rem; color: var(--text-muted); }

    .recipe-box { margin: 1.2rem 0; }
    .section-subtitle { font-size: 0.9rem; color: var(--gold); margin-bottom: 0.3rem; font-weight: 600; }
    .recipe-text { color: #d6d6e0; font-size: 0.85rem; line-height: 1.5; }
    .ingredient-tags { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-top: 0.6rem; }
    .ing-tag { background: #20202c; color: #d1d1db; font-size: 0.75rem; padding: 3px 10px; border-radius: 12px; border: 1px solid #313142; }

    .modal-actions-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.8rem; margin-top: 1.2rem; }
    .modal-add-cart-btn { background: var(--gold); color: #000; padding: 0.85rem; border-radius: 8px; border: none; font-weight: 700; cursor: pointer; }
    .modal-wa-btn { background: #25d366; color: #fff; padding: 0.85rem; border-radius: 8px; text-decoration: none; font-weight: 700; text-align: center; }

      const userData = {
        action: "register",
        name: document.getElementById('regName').value,
        phone: document.getElementById('regPhone').value,
        email: document.getElementById('regEmail').value,
        address: document.getElementById('regAddress').value,
        password: document.getElementById('regPass').value
      };

      localStorage.setItem('foodzillaUser', JSON.stringify(userData));

      if (GOOGLE_SHEET_WEBHOOK_URL) {
        fetch(GOOGLE_SHEET_WEBHOOK_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(userData)
        }).catch(err => console.log('Sheet error:', err));
      }

      alert(`Dhanyawad ${userData.name}! Foodzilla me aapka account create ho gaya hai.`);
      closeAuthModal();
      checkUserSession();
    }

    function processCheckout() {
      const currentUser = JSON.parse(localStorage.getItem('foodzillaUser'));
      if (!currentUser) {
        alert('Kripya pehle Login ya Account create karein taaki delivery details save ho sakein.');
        openAuthModal();
        return;
      }

      const paymentType = document.querySelector('input[name="paymentType"]:checked').value;
      const subtotal = cart.reduce((acc, item) => acc + (item.price * item.qty), 0);
      const gst = Math.round(subtotal * 0.05);
      const grandTotal = subtotal + gst;

      const itemsSummary = cart.map(i => `${i.name} (Qty: ${i.qty}) - ₹${i.price * i.qty}`).join(", ");

      const orderData = {
        action: "order",
        name: currentUser.name,
        phone: currentUser.phone,
        address: currentUser.address,
        items: itemsSummary,
        deliveryStatus: "Pending",
        paymentStatus: paymentType === 'ONLINE' ? `Online UPI (₹${grandTotal})` : `COD (₹${grandTotal})`
      };

      if (GOOGLE_SHEET_WEBHOOK_URL) {
        fetch(GOOGLE_SHEET_WEBHOOK_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(orderData)
        }).catch(err => console.log('Order sheet error:', err));
      }

      let orderSummary = `🦖 *Foodzilla Fast Food Order Summary*\n`;
      orderSummary += `👤 Name: ${currentUser.name}\n📞 Phone: ${currentUser.phone}\n📍 Address: ${currentUser.address}\n---------------------------\n`;
      cart.forEach((item, index) => {
        orderSummary += `${index + 1}. ${item.name} x ${item.qty} = ₹${item.price * item.qty}\n`;
      });
      orderSummary += `---------------------------\nSubtotal: ₹${subtotal}\nGST (5%): ₹${gst}\n*Grand Total: ₹${grandTotal}*\n💳 Payment: ${orderData.paymentStatus}`;

      window.open(`https://wa.me/919876543210?text=${encodeURIComponent(orderSummary)}`, '_blank');
      
      cart = [];
      saveCart();
      toggleCart(false);
      alert('Order successfully placed! Details Google Sheet aur WhatsApp par bhej di gayi hain.');
    }

    function handleLogin(e) {
      e.preventDefault();
      const user = document.getElementById('loginUser').value;
      const pass = document.getElementById('loginPass').value;
      const savedUser = JSON.parse(localStorage.getItem('foodzillaUser'));

      if (savedUser && (savedUser.phone === user || savedUser.email === user) && savedUser.pass === pass) {
        alert(`Welcome back, ${savedUser.name}!`);
        closeAuthModal();
        checkUserSession();
      } else {
        const demoUser = { name: user.split('@')[0], phone: user, email: user, address: 'Nagaur, Rajasthan' };
        localStorage.setItem('foodzillaUser', JSON.stringify(demoUser));
        alert('Login successful!');
        closeAuthModal();
        checkUserSession();
      }
    }

    function checkUserSession() {
      const user = JSON.parse(localStorage.getItem('foodzillaUser'));
      const btn = document.getElementById('userProfileBtn');
      if (user) {
        btn.innerHTML = `👤 <span>${user.name.split(' ')[0]}</span>`;
      } else {
        btn.innerHTML = `👤 <span>Login / Account</span>`;
      }
    }

    function toggleCart(forceOpen) {
      const cartEl = document.getElementById('cartDrawer');
      const overlay = document.getElementById('drawerOverlay');
      if (forceOpen === true) {
        cartEl.classList.add('active');
        overlay.classList.add('active');
      } else {
        cartEl.classList.toggle('active');
        overlay.classList.toggle('active');
      }
    }

    function toggleSidebar() {
      const sidebar = document.getElementById('sidebarDrawer');
      const overlay = document.getElementById('drawerOverlay');
      sidebar.classList.toggle('active');
      overlay.classList.toggle('active');
    }

    function closeAllDrawers() {
      document.getElementById('sidebarDrawer').classList.remove('active');
      document.getElementById('cartDrawer').classList.remove('active');
      document.getElementById('drawerOverlay').classList.remove('active');
    }

    function openAuthModal() {
      closeAllDrawers();
      document.getElementById('authModal').classList.add('active');
    }
    function closeAuthModal() { document.getElementById('authModal').classList.remove('active'); }
    function closeAuthModalOnOutside(e) { if (e.target.id === 'authModal') closeAuthModal(); }

    function switchAuthTab(tab, btn) {
      document.querySelectorAll('.auth-tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      if (tab === 'login') {
        document.getElementById('loginForm').style.display = 'block';
        document.getElementById('registerForm').style.display = 'none';
      } else {
        document.getElementById('loginForm').style.display = 'none';
        document.getElementById('registerForm').style.display = 'block';
      }
    }

    function renderMenu(items) {
      const grid = document.getElementById('menuGrid');
      grid.innerHTML = items.map(item => `
        <div class="menu-card">
          <div class="card-img-wrap" onclick="openDetailModal(${item.id})">
            <img src="${item.img}" alt="${item.name}">
            <span class="calorie-pill">🔥 ${item.calories}</span>
          </div>
          <div class="card-content">
            <div class="card-title-row">
              <h3 class="card-title" onclick="openDetailModal(${item.id})">${item.name}</h3>
              <span class="card-price">₹${item.price}</span>
            </div>
            <div class="veg-indicator"><div class="veg-dot"></div><span>PURE VEG</span></div>
            <p class="card-desc">${item.shortDesc}</p>
            <div class="card-action-row">
              <button class="btn-add-cart" onclick="addToCart(${item.id})">🛒 Add to Cart</button>
              <a href="${getWaOrderLink(item.name, item.price)}" target="_blank" class="btn-quick-wa">📱 WhatsApp</a>
            </div>
          </div>
        </div>
      `).join('');
    }

    function filterCategory(category, btnElement) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if (btnElement) btnElement.classList.add('active');
      const filtered = foodDatabase.filter(item => item.category === category);
      renderMenu(filtered);
    }

    function openDetailModal(id) {
      const item = foodDatabase.find(x => x.id === id);
      if (!item) return;

      document.getElementById('modalImg').src = item.img;
      document.getElementById('modalTitle').innerText = item.name;
      document.getElementById('modalPrice').innerText = `₹${item.price}`;
      document.getElementById('modalCalories').innerText = item.calories;
      document.getElementById('modalProtein').innerText = item.protein;
      document.getElementById('modalCarbs').innerText = item.carbs;
      document.getElementById('modalFat').innerText = item.fat;
      document.getElementById('modalRecipe').innerText = item.recipe;

      const ingEl = document.getElementById('modalIngredients');
      ingEl.innerHTML = item.ingredients.map(ing => `<span class="ing-tag">${ing}</span>`).join('');

      document.getElementById('modalAddCartBtn').onclick = () => {
        addToCart(item.id);
        closeDetailModal();
      };
      document.getElementById('modalWaBtn').href = getWaOrderLink(item.name, item.price);

      document.getElementById('detailModal').classList.add('active');
    }

    function closeDetailModal() { document.getElementById('detailModal').classList.remove('active'); }
    function closeDetailModalOnOutside(e) { if (e.target.id === 'detailModal') closeDetailModal(); }

    document.addEventListener('DOMContentLoaded', () => {
      filterCategory('burger', document.querySelector('.tab-btn.active'));
      updateCartUI();
      checkUserSession();
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        closeDetailModal();
        closeAuthModal();
        closeAllDrawers();
      }
    });
  </script>
</body>
</html>
